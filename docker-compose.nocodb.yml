version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: app-controle-db
    environment:
      POSTGRES_DB: app_controle
      POSTGRES_USER: nocodb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-UltraThink_2026_Secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb_user -d app_controle"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NocoDB - Dashboard para não-técnicos
  nocodb:
    image: nocodb/nocodb:latest
    container_name: app-controle-nocodb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Connection
      NC_DB: "pg://postgres:5432?u=nocodb_user&p=${DB_PASSWORD:-UltraThink_2026_Secure}&d=app_controle"
      
      # NocoDB Config
      NC_AUTH_JWT_SECRET: ${JWT_SECRET:-nocodb_jwt_secret_ultra_2026}
      NC_PUBLIC_URL: http://localhost:8080
      NC_DISABLE_TELE: true  # Desabilitar telemetria
      
      # Admin User (primeiro acesso)
      NC_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ultrathink.com}
      NC_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-UltraThink@Admin2026!}
      
      # Limits
      NC_MAX_ATTACHMENTS_ALLOWED: 10
      NC_ATTACHMENT_FIELD_SIZE: 52428800  # 50MB
      
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Opcional: pgAdmin para gestão direta do DB
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: app-controle-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ultrathink.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-UltraThink@Admin2026!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - postgres
    profiles:
      - tools  # Iniciar apenas com: docker-compose --profile tools up
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  nocodb_data:
    driver: local

networks:
  app-network:
    driver: bridge

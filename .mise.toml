# =============================================================================
# TAREFAS DE SEGURANCA (Conformidade ambiente-centralizado)
# =============================================================================

[tasks."security:scan"]
description = "Verificacao de secrets no codigo (gitleaks)"
run = """
#!/bin/bash
echo "🔍 Verificando secrets no codigo..."
if ! command -v gitleaks &>/dev/null; then
  echo "⚠️  gitleaks nao instalado. Execute: mise install"
  exit 1
fi

gitleaks detect --verbose --no-git
RESULT=$?

if [ $RESULT -eq 0 ]; then
  echo "✅ Nenhum secret detectado"
else
  echo "❌ SECRETS DETECTADOS! Corrija antes do commit"
  exit 1
fi
"""

[tasks."security:scan-staged"]
description = "Verificar secrets apenas em arquivos staged"
run = """
#!/bin/bash
echo "🔍 Verificando secrets em arquivos staged..."
if ! command -v gitleaks &>/dev/null; then
  echo "⚠️  gitleaks nao instalado. Execute: mise install"
  exit 1
fi

gitleaks protect --staged --verbose
RESULT=$?

if [ $RESULT -eq 0 ]; then
  echo "✅ Nenhum secret detectado em arquivos staged"
else
  echo "❌ SECRETS DETECTADOS em staged files! Corrija antes do commit"
  exit 1
fi
"""

# =============================================================================
# TAREFAS DE DEPLOY (Fly.io - Conformidade ambiente-centralizado)
# =============================================================================

[tasks."deploy:check"]
description = "Verifica pre-requisitos para deploy"
run = """
#!/bin/bash
echo "🔍 Verificando pre-requisitos para deploy..."
echo ""

# Verificar flyctl
if ! command -v flyctl &>/dev/null; then
  echo "❌ flyctl nao instalado"
  echo "   Instale: curl -L https://fly.io/install.sh | sh"
  exit 1
fi
echo "✅ flyctl: $(flyctl version 2>/dev/null | head -1)"

# Verificar autenticacao
if ! flyctl auth whoami &>/dev/null 2>&1; then
  echo "❌ Nao autenticado no Fly.io"
  echo "   Execute: flyctl auth login"
  exit 1
fi
echo "✅ Autenticado como: $(flyctl auth whoami 2>/dev/null)"

# Verificar app existe
if flyctl apps list 2>/dev/null | grep -q "trainb2b-demo"; then
  echo "✅ App trainb2b-demo existe"
else
  echo "⚠️  App trainb2b-demo nao existe"
  echo "   Execute: flyctl launch --name trainb2b-demo --region gru --no-deploy"
fi

# Verificar gh auth
if command -v gh &>/dev/null; then
  if gh auth status &>/dev/null 2>&1; then
    echo "✅ GitHub CLI autenticado"
  else
    echo "⚠️  GitHub CLI nao autenticado"
    echo "   Execute: gh auth login"
  fi
else
  echo "⚠️  GitHub CLI nao instalado"
fi

echo ""
echo "✅ Verificacao concluida!"
"""

[tasks."deploy:prod"]
description = "Deploy para Fly.io (requer auth)"
depends = ["build", "test"]
run = """
#!/bin/bash
echo "🚀 Iniciando deploy para Fly.io..."

# Verificar autenticacao
if ! flyctl auth whoami &>/dev/null 2>&1; then
  echo "❌ Nao autenticado no Fly.io"
  echo "   Execute: flyctl auth login"
  exit 1
fi

flyctl deploy --remote-only
echo ""
echo "✅ Deploy concluido!"
echo "📍 URL: https://trainb2b-demo.fly.dev"
"""

[tasks."deploy:logs"]
description = "Ver logs do Fly.io em tempo real"
run = "flyctl logs -a trainb2b-demo"

[tasks."deploy:status"]
description = "Status da aplicacao no Fly.io"
run = """
#!/bin/bash
echo "📊 Status da aplicacao trainb2b-demo:"
echo ""
flyctl status -a trainb2b-demo
echo ""
flyctl apps releases -a trainb2b-demo --image | head -10
"""

[tasks."deploy:open"]
description = "Abrir aplicacao no browser"
run = "flyctl open -a trainb2b-demo"

[tasks."deploy:suspend"]
description = "Pausar app (economia de custos)"
run = """
#!/bin/bash
echo "⏸️  Pausando app trainb2b-demo..."
flyctl apps suspend trainb2b-demo
echo "✅ App pausado (economia ativa)"
echo "💡 Para reativar: mise deploy:resume"
"""

[tasks."deploy:resume"]
description = "Reativar app pausado"
run = """
#!/bin/bash
echo "▶️  Reativando app trainb2b-demo..."
flyctl apps resume trainb2b-demo
echo "✅ App reativado"
echo "📍 URL: https://trainb2b-demo.fly.dev"
"""

# =============================================================================
# ALIASES ÚTEIS (sintaxe atual do mise)
# =============================================================================

[alias.bun.versions]
latest = "1.3.3"
current = "1.3.3"

[alias.node.versions]
lts = "24.11.1"
current = "24.11.1"

[alias.python.versions]
default = "3.12"

# =============================================================================
# CONFIGURAÇÕES LOCAIS
# =============================================================================

[settings]
# Confirmar automaticamente instalações
yes = true

# Modo verboso desativado
verbose = false

# Usar recursos experimentais (shims para IDEs)
experimental = true

# CONFORMIDADE: Habilitar lockfile para reprodutibilidade (P2)
lockfile = true

# Hooks de automação para Claude Code
# Configuração de hooks para execução automática em eventos específicos

[hooks]

# Hook pre-tool: Executa antes de operações críticas
[hooks.pre_tool]
# Proteção contra rm -rf em diretórios importantes
protected_paths = [
  "src/",
  "docs/",
  ".claude/",
  ".factory/",
  "package.json",
  "bun.lock"
]

# Hook post-tool: Executa após certas operações
[hooks.post_tool]
# Auto-format após edições
auto_format = true
format_command = "bun run lint -- --fix"

# Hook de sessão
[hooks.session]
# Arquivos para verificar no início da sessão
startup_checks = [
  "docs/backlog/ROADMAP.md",
  ".mise.toml"
]

# Mensagem de boas-vindas
welcome_message = """
╔════════════════════════════════════════════════════════════════╗
║  🎓 app-controle (UltraThink)                                  ║
║     Plataforma B2B de Treinamento Técnico Corporativo          ║
╠════════════════════════════════════════════════════════════════╣
║  Quick Commands:                                                ║
║    bun run dev              Start development server           ║
║    bun run test             Run tests                          ║
║    mise run security        Security scan                      ║
║                                                                 ║
║  Slash Commands:                                                ║
║    /quick-audit             Quick health check                 ║
║    /full-coverage           Coverage report                    ║
║    /pr-ready                Pre-PR checklist                   ║
╚════════════════════════════════════════════════════════════════╝
"""

# Validações de commit
[hooks.before_commit]
# Comandos para executar antes de commit
checks = [
  "bun run lint",
  "bun run test"
]

# Verificar por secrets
check_secrets = true
secret_patterns = [
  "password",
  "secret",
  "api_key",
  "token",
  "private_key"
]

# Padrões de arquivos sensíveis
[hooks.sensitive_files]
warn_on_edit = [
  ".env",
  ".env.*",
  "credentials.*",
  "*.pem",
  "*.key"
]

# Notificações
[hooks.notifications]
# Notificar quando tasks longas completam
on_long_task_complete = true
long_task_threshold_seconds = 60

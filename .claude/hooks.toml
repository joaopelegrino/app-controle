# Hooks de automação para Claude Code
# Projeto: Plataforma B2B de treinamento técnico corporativo Completo

# ===========================================
# PRE-TOOL USE HOOKS
# ===========================================

[[hooks]]
event = "PreToolUse"
priority = 1
[hooks.matcher]
tool_name = "Bash"
pattern = "rm|delete|drop"
[hooks.action]
type = "block"
message = "⚠️ Operação destrutiva detectada. Use --force para confirmar ou revise o comando."

[[hooks]]
event = "PreToolUse"
priority = 2
[hooks.matcher]
tool_name = "Write|Edit"
file_paths = ["*.env", "*.key", "*.pem"]
[hooks.action]
type = "confirm"
message = "⚠️ Modificando arquivo sensível. Tem certeza?"

# ===========================================
# POST-TOOL USE HOOKS
# ===========================================

[[hooks]]
event = "PostToolUse"
priority = 1
run_in_background = true
[hooks.matcher]
tool_name = "Edit|Write|MultiEdit"
file_paths = ["*.jsx", "*.js"]
[hooks.action]
type = "command"
command = """
#!/bin/bash
# Formatar código automaticamente
if command -v prettier &> /dev/null; then
    prettier --write $CLAUDE_FILE_PATHS 2>/dev/null || true
fi
# Verificar sintaxe
npx eslint $CLAUDE_FILE_PATHS --fix 2>/dev/null || true
"""
timeout = 15000

[[hooks]]
event = "PostToolUse"
priority = 2
[hooks.matcher]
tool_name = "Edit|Write"
file_paths = ["*.css", "*.scss"]
[hooks.action]
type = "command"
command = "npx prettier --write $CLAUDE_FILE_PATHS"
timeout = 10000

[[hooks]]
event = "PostToolUse"
priority = 3
[hooks.matcher]
tool_name = "Write"
file_paths = ["*.test.jsx", "*.test.js", "*.spec.js"]
[hooks.action]
type = "command"
command = "npm test -- $CLAUDE_FILE_PATHS --run 2>/dev/null || echo 'Teste criado, execute npm test para validar'"

# ===========================================
# SESSION HOOKS
# ===========================================

[[hooks]]
event = "SessionStart"
priority = 1
[hooks.action]
type = "script"
script = """
#!/bin/bash
echo "=== Claude Code Session Started ==="
echo "📅 Date: $(date '+%Y-%m-%d %H:%M:%S')"
echo "👤 User: $(whoami)"
echo "📁 Directory: $(pwd)"
echo "🌿 Git Branch: $(git branch --show-current 2>/dev/null || echo 'not a git repo')"
echo "📦 Node: $(node -v)"
echo "📦 NPM: $(npm -v)"
echo ""
echo "🚀 Project: Plataforma B2B de treinamento técnico corporativo Completo"
echo "⚡ Quick Commands:"
echo "  - /fix <error> - Corrigir erro"
echo "  - /test - Rodar testes"
echo "  - /deploy local - Deploy local"
echo ""

# Verificar estado do projeto
if [ -f "package.json" ]; then
    echo "📋 Dependencies Status:"
    npm audit --audit-level=moderate 2>&1 | head -5
fi

# Verificar se servidor está rodando
if lsof -i:3000 &>/dev/null; then
    echo "✅ Dev server running on port 3000"
else
    echo "ℹ️ Dev server not running. Use 'npm run dev' to start"
fi
"""

[[hooks]]
event = "PreCompact"
priority = 1
[hooks.action]
type = "command"
command = """
echo "📦 Saving context before compacting..." && \
mkdir -p .claude/backups && \
echo "Context saved at $(date)" > .claude/backups/context-$(date +%Y%m%d-%H%M%S).md
"""

[[hooks]]
event = "Stop"
priority = 1
[hooks.action]
type = "script"
script = """
#!/bin/bash
echo "=== Claude Code Session Ended ==="
echo "📅 Date: $(date '+%Y-%m-%d %H:%M:%S')"

# Salvar estado da sessão
if [ -d ".claude" ]; then
    echo "Session ended at $(date)" >> .claude/session.log
    
    # Listar arquivos modificados
    echo "📝 Files modified in this session:"
    git status --short 2>/dev/null | head -10
    
    # Sugerir próximos passos
    echo ""
    echo "💡 Suggested next steps:"
    if git diff --name-only | grep -q "test"; then
        echo "  - Run tests: npm test"
    fi
    if git diff --name-only | grep -q "jsx\|js"; then
        echo "  - Check build: npm run build"
    fi
    echo "  - Commit changes: git add . && git commit -m 'your message'"
fi
"""

# ===========================================
# ERROR HANDLING HOOKS
# ===========================================

[[hooks]]
event = "OnError"
priority = 1
[hooks.action]
type = "script"
script = """
#!/bin/bash
echo "❌ Error detected in Claude Code session"
echo "Error details saved to .claude/error.log"
echo "$CLAUDE_ERROR" >> .claude/error.log
echo ""
echo "💡 Common fixes:"
echo "  - Check npm dependencies: npm install"
echo "  - Clear node_modules: rm -rf node_modules && npm install"
echo "  - Check for syntax errors: npm run lint"
"""

# ===========================================
# CUSTOM TRIGGER HOOKS
# ===========================================

[[hooks]]
event = "CustomTrigger"
trigger = "before_commit"
[hooks.action]
type = "script"
script = """
#!/bin/bash
echo "🔍 Pre-commit checks..."

# Verificar testes
npm test -- --run --silent
if [ $? -ne 0 ]; then
    echo "❌ Tests failing. Fix before committing."
    exit 1
fi

# Verificar build
npm run build --silent
if [ $? -ne 0 ]; then
    echo "❌ Build failing. Fix before committing."
    exit 1
fi

# Verificar linting
npm run lint --silent
if [ $? -ne 0 ]; then
    echo "⚠️ Linting issues found. Consider fixing."
fi

echo "✅ Pre-commit checks passed!"
"""
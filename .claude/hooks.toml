# Claude Code Hooks Configuration
# Version: 1.0.0
# Project: app-controle (TrainB2B)
# Updated: 2026-02-16

# =============================================================================
# Session Hooks
# =============================================================================

[session-start]
command = "mise check"
description = "Verificar ambiente mise ao iniciar sessão Claude Code"
enabled = true

# =============================================================================
# Git Hooks
# =============================================================================

[pre-commit]
command = "bun run test && bun run lint"
description = "Rodar testes e lint antes de commits"
enabled = true
timeout = 120000  # 2 minutos

[post-commit]
command = "echo 'Commit realizado com sucesso!'"
description = "Confirmação de commit"
enabled = false

# =============================================================================
# Tool Use Hooks
# =============================================================================

[post-tool-use]
command = "echo ''"
description = "Log de uso de ferramentas (desabilitado)"
enabled = false

# =============================================================================
# Environment Hooks
# =============================================================================

[pre-task]
command = "mise current"
description = "Verificar runtime atual antes de tarefas"
enabled = false

# =============================================================================
# Security Hooks
# =============================================================================

[pre-deploy]
command = "mise run security:scan-staged"
description = "Scan de segurança antes de deploy"
enabled = true
timeout = 60000  # 1 minuto

# =============================================================================
# Notes
# =============================================================================
# - enabled=true: Hook ativo
# - enabled=false: Hook desabilitado (pode habilitar quando necessário)
# - timeout: Tempo máximo de execução em ms (padrão: 30000)
# - Para adicionar novos hooks, seguir formato acima
# - Comandos podem usar mise tasks (mise run <task>)

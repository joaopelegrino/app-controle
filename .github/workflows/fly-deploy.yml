# Deploy automático para Fly.io
# Documentação: https://fly.io/docs/launch/continuous-deployment-with-github-actions/

name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - desenvolvimento
  workflow_dispatch:  # Permite deploy manual via GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test --run

      - name: Build (validate)
        run: bun run build
        env:
          VITE_API_BASE_URL: http://localhost:8081
          VITE_PLATFORM_NAME: TrainB2B
          VITE_STORAGE_PREFIX: trainb2b

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test  # Só deploya se testes passarem

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "::notice title=Deploy Successful::App deployed to https://trainb2b-demo.fly.dev"

      - name: Get deployment URL
        if: success()
        run: |
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://trainb2b-demo.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

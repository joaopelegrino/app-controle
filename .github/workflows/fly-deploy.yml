# Deploy automatico para Fly.io
# Documentacao: https://fly.io/docs/launch/continuous-deployment-with-github-actions/
# Conformidade: ambiente-centralizado (mise-action)

name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - desenvolvimento
  workflow_dispatch:  # Permite deploy manual via GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CONFORMIDADE: Usar mise-action para garantir mesmas versoes
      - name: Setup mise
        uses: jdx/mise-action@v2

      # CONFORMIDADE: Usar mise tasks em vez de comandos diretos
      - name: Install dependencies
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Run tests
        run: mise run test

      - name: Security scan (gitleaks)
        run: mise run security:scan
        continue-on-error: true  # Nao bloqueia deploy enquanto estabiliza

      - name: Build (validate)
        run: mise run build
        env:
          VITE_API_BASE_URL: http://localhost:8081
          VITE_PLATFORM_NAME: TrainB2B
          VITE_STORAGE_PREFIX: trainb2b

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test  # So deploya se testes passarem

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify deployment
        if: success()
        run: |
          echo "::notice title=Deploy Successful::App deployed to https://trainb2b-demo.fly.dev"

      - name: Get deployment URL
        if: success()
        run: |
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://trainb2b-demo.fly.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
